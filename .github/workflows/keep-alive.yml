# بيلمس قاعدة البيانات كل 3 أيام عشان Supabase مايوقفش المشروع (بيوقفه بعد 7 أيام من غير استخدام)
name: keep-alive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' 'https://zsrstmpmscyaktcctzpx.supabase.co/rest/v1/app_state?select=id&limit=1' -H 'apikey: sb_publishable_9zIMJJfX0FW0qREmsLiulg_SnhcjU0T')
          echo "HTTP $code"
          # 401 = قاعدة البيانات ردّت (مقفولة على اللي داخل بس، وده المطلوب). غير كده يبقى المشروع واقف
          test "$code" = 401 -o "$code" = 200
